version: "3.0"

services:
    db:
        image: postgres:17-alpine
        container_name: postgres-db
        environment:
            POSTGRES_DB: praktikumdb
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d praktikumdb"]
            interval: 5s
            timeout: 5s
            retries: 5
        volumes:
            - postgres_data:/var/lib/postgresql/data

    app:
        image: web-database:1.0
        container_name: praktikum-web-database-20230140016
        build: .
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "8080:8080"
        env_file:
            - .env

volumes:
    postgres_data:
